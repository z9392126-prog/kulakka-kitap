# Құлаққа кітап — сайтты "ұйықтатпау"
# Тегін Supabase жобасы бір апта бойы ешкім кірмесе тоқтап қалуы мүмкін.
# Бұл тапсырма күн сайын дерекқорға бір рет сұрау жібереді,
# ал аптасына бір рет репозиторийге белгі жазады (GitHub оны өшіріп тастамауы үшін).
name: Keepalive

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Supabase-ке сұрау жіберу
        run: |
          URL=$(grep -oP 'supabaseUrl:\s*"\K[^"]+' config.js || true)
          KEY=$(grep -oP 'supabaseKey:\s*"\K[^"]+' config.js || true)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "config.js толтырылмаған"; exit 1; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/stories?select=id&limit=1" -H "apikey: $KEY")
          echo "Жауап коды: $code"
          [ "$code" = "200" ]

      - name: Апталық белгі
        if: github.event.schedule == '17 3 * * *'
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ ! -f .keepalive ]; then
            date -u > .keepalive
            git config user.name "kulakka-kitap-bot"
            git config user.email "actions@users.noreply.github.com"
            git add .keepalive
            git commit -m "keepalive" && git push || true
          fi
